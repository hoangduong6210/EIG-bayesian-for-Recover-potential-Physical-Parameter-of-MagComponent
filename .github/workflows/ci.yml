name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest

  wiki:
    name: Wiki manuscript contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Validate the canonical scientific source
        run: python wiki/build.py check
      - name: Test wiki evidence and export contracts
        run: pytest -q wiki/tests

  archived-document-evidence:
    name: Archived document evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Verify evidence used by the archived full-paper render
        run: |
          release_id="$(sed -n 's/^release_id:[[:space:]]*//p' paper/current_state/results.lock.yaml)"
          test -n "$release_id"
          (cd "results/frozen/$release_id" && sha256sum --check checksums.sha256)
          python scripts/validate_run.py \
            --run-dir "results/frozen/$release_id" \
            --mode verify-lock
        env:
          SLURM_JOB_ID: ci
          SLURM_JOB_NODELIST: localhost
