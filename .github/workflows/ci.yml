name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - name: Verify frozen evidence checksums
        run: sha256sum --check checksums.sha256
        working-directory: results/frozen/20260812T035654Z_a0703698ace9
      - run: >-
          python scripts/validate_run.py
          --run-dir results/frozen/20260812T035654Z_a0703698ace9
          --mode verify-lock
        env:
          SLURM_JOB_ID: ci
          SLURM_JOB_NODELIST: localhost
