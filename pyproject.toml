[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magcore-calib"
version = "1.0.0"
description = "Isothermal Bayesian calibration and EIG design for magnetic-core models"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "emcee>=3.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests", "wiki/tests"]
addopts = "-q"
