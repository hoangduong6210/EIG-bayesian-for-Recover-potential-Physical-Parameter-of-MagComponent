[model]
temperature_c = 25.0
temperature_tolerance_c = 0.5

[sampler]
n_walkers = 48
n_steps = 5000
burn = 1000

[diagnostics]
min_ess = 400.0
min_steps_per_tau = 50.0
acceptance_min = 0.20
acceptance_max = 0.60

[eig]
n_outer = 300
n_inner = 100
replicates = 20
objectives = ["raw", "per_cost"]
max_measurements = 25

# Assumed acquisition durations used only for modeled-cost objectives. They are
# not measured laboratory times.
[eig.modeled_cost_seconds]
pcv = 60.0
mu_real = 20.0
mu_imag = 20.0
lm = 15.0

# Seed namespaces are intentionally disjoint. Recovery seeds remain a compact
# implementation check; acquisition seeds define the 30-pair benchmark.
[study.seeds]
recovery = [42, 43, 44, 45, 46]
validation_state = [7100, 7101, 7102, 7103]
downstream_validation = [7200, 7201, 7202, 7203, 7204, 7205, 7206, 7207, 7208, 7209]
acquisition = [7300, 7301, 7302, 7303, 7304, 7305, 7306, 7307, 7308, 7309,
               7310, 7311, 7312, 7313, 7314, 7315, 7316, 7317, 7318, 7319,
               7320, 7321, 7322, 7323, 7324, 7325, 7326, 7327, 7328, 7329]

[study.estimator_validation]
observation_counts = [2, 4, 6]
outer_grid = [100, 300, 900]
inner_grid = [50, 100, 300]
replicate_grid = [5, 10, 20]
reference = { n_outer = 1200, n_inner = 400, n_replicates = 40 }
audit = { n_outer = 2400, n_inner = 800, n_replicates = 40 }

[study.estimator_validation.thresholds]
min_top1_probability = 0.80
min_rank_correlation = 0.95
min_interval_overlap_rate = 0.80
max_relative_reference_regret = 0.01
endpoint_atol = 0

# Exact registry for the next confirmatory benchmark. These policies are
# implemented and preregistered here but have no result in the current frozen
# release; no comparative claim may be made until a new release is validated.
[study.comparator_benchmark]
version = 4
candidate_count = 37
policies = [
  "eig_raw",
  "eig_per_cost",
  "fixed_channel_balanced",
  "random_channel_balanced",
  "predictive_variance_raw",
  "predictive_variance_per_cost",
  "laplace_d_opt_raw",
  "laplace_d_opt_per_cost",
]
reference_policy = "fixed_channel_balanced"
secondary_validation_used_for_stopping = false

# Exact policy semantics and primary estimands.  These rows are serialized into
# every seed record so that a label cannot silently change meaning at runtime.
policy_registry = [
  { policy = "eig_raw", method = "eig", objective = "raw", primary_endpoint = "measurement_count_to_gate" },
  { policy = "eig_per_cost", method = "eig", objective = "per_cost", primary_endpoint = "modeled_cost_to_gate" },
  { policy = "fixed_channel_balanced", method = "fixed_channel_balanced", objective = "fixed_channel_balanced_traversal", primary_endpoint = "descriptive_count_and_modeled_cost" },
  { policy = "random_channel_balanced", method = "random_channel_balanced", objective = "random_channel_balanced_traversal", primary_endpoint = "descriptive_count_and_modeled_cost" },
  { policy = "predictive_variance_raw", method = "predictive_variance", objective = "raw", primary_endpoint = "measurement_count_to_gate" },
  { policy = "predictive_variance_per_cost", method = "predictive_variance", objective = "per_cost", primary_endpoint = "modeled_cost_to_gate" },
  { policy = "laplace_d_opt_raw", method = "laplace_d_opt", objective = "raw", primary_endpoint = "measurement_count_to_gate" },
  { policy = "laplace_d_opt_per_cost", method = "laplace_d_opt", objective = "per_cost", primary_endpoint = "modeled_cost_to_gate" },
]

# Confirmatory EIG-versus-strong-comparator contrasts.  Fixed and randomized
# balanced traversals remain reference/descriptive controls.
direct_contrasts = [
  { name = "eig_raw_vs_predictive_variance_raw", policy = "eig_raw", comparator = "predictive_variance_raw", endpoint = "measurement_count_to_gate" },
  { name = "eig_raw_vs_laplace_d_opt_raw", policy = "eig_raw", comparator = "laplace_d_opt_raw", endpoint = "measurement_count_to_gate" },
  { name = "eig_per_cost_vs_predictive_variance_per_cost", policy = "eig_per_cost", comparator = "predictive_variance_per_cost", endpoint = "modeled_cost_to_gate" },
  { name = "eig_per_cost_vs_laplace_d_opt_per_cost", policy = "eig_per_cost", comparator = "laplace_d_opt_per_cost", endpoint = "modeled_cost_to_gate" },
]

[study.comparator_benchmark.holdout_contract]
total_points = 23
used_for_acquisition_or_stopping = false
pcv = 8
mu_real = 6
mu_imag = 6
lm = 3

[study.comparator_benchmark.claim_context]
synthetic = true
matched_model = true
prior_predictive_truth = true
datasheet_centered_on_realized_truth = false
oracle_initialized = false
measured_data = false
scope = "algorithmic matched-model synthetic benchmark; not validated laboratory efficiency"

# Acquisition-only amendment after fail-closed computational pilots: fixed
# 5,000- and 20,000-step budgets yielded adequate ESS but fewer than 50
# steps/tau in some weak early states. Neither invalid campaign was aggregated.
[study.comparator_benchmark.sampler]
n_walkers = 48
n_steps = 20000
burn = 4000
max_steps = 80000
check_interval = 10000

[study.prior_center_offset]
levels = [0.00, 0.15, 0.30]
interpretation = "dimensionless coordinate shifts, not percentage perturbations"
structural_model_mismatch = false

[stop_rule]
quantity = "latent_mean_response"
pcv_ci_half_width_pct = 8.0
lm_ci_half_width_pct = 5.0
pcv_target = { frequency_hz = 100000.0, b_pk_t = 0.1, temperature_c = 25.0 }
lm_target = { frequency_hz = 100000.0, b_pk_t = 0.0, temperature_c = 25.0 }
