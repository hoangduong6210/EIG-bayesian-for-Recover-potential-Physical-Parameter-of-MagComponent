# The four scenarios form a prospective control/ablation set.  All deviations
# are fixed before MM-1 outcomes are generated.  The two-pole law partitions
# (mu_s - 1) between two Cole--Cole relaxations.  PCV discrepancy multiplies
# Steinmetz loss by exp(gamma_T*(T-25) + q_f*log10(f/1e5)^2
#                       + q_fb*log10(f/1e5)*log10(B/0.1)).

[[scenarios]]
name = "matched_control"
second_pole_fraction = 0.0
first_pole_frequency_multiplier = 1.0
second_pole_frequency_multiplier = 1.0
first_pole_alpha_offset = 0.0
second_pole_alpha_offset = 0.0
pcv_temperature_log_slope_per_c = 0.0
pcv_log_frequency_curvature = 0.0
pcv_log_frequency_flux_interaction = 0.0

